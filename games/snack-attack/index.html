<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snack Attack</title>
<link rel="stylesheet" href="/kit/kit.css">
<style>:root{--bg:#2b2440}</style>
</head>
<body>
<script src="/kit/kit.js"></script>
<script>
(() => {
const K = Kit({ W: 800, H: 450 }), { ctx, C } = K, W = 800, H = 450;
const ROCKS = [{ x: 210, y: 150, r: 34 }, { x: 590, y: 300, r: 34 }, { x: 420, y: 110, r: 22 }, { x: 330, y: 340, r: 22 }];
const GUMMY_COLS = ['rgba(255,90,54,.9)', 'rgba(46,230,193,.9)', 'rgba(255,201,60,.9)', 'rgba(142,108,240,.9)', 'rgba(255,93,162,.9)'];
let state = 'menu', mode = 1, players, foes, shots, seeds, drops, wave, toSpawn, spawnT, waveBreak, score, endAt = 0, banner = '', bannerT = 0;

function mkPlayer(i, color) { return { i, color, x: W / 2 + (i ? 40 : -40) * (mode === 2 ? 1 : 0), y: H / 2 + 30, hp: 5, inv: 1.5, cd: 0, rapid: 0, shield: 0, down: false, revive: 0, fx: 1, fy: 0, walk: 0 }; }
function newGame(m) {
  mode = m; players = [mkPlayer(0, C.lemon)]; if (m === 2) players.push(mkPlayer(1, C.sky));
  foes = []; shots = []; seeds = []; drops = []; wave = 0; score = 0; waveBreak = 1; toSpawn = 0;
  state = 'play'; K.playing = true; K.clearParts();
}
function startWave() {
  wave++; toSpawn = 6 + wave * 3; spawnT = 0; banner = `Wave ${wave}`; bannerT = 1.6;
  K.jingle([392, 523, 659], 90, 'square', .035);
}
function spawn() {
  const side = K.irnd(0, 3), t = Math.random();
  const x = side === 0 ? t * W : side === 1 ? W + 20 : side === 2 ? t * W : -20;
  const y = side === 0 ? -20 : side === 1 ? t * H : side === 2 ? H + 20 : t * H;
  const roll = Math.random();
  let f;
  if (wave >= 3 && roll < .15 + wave * .01) f = { type: 'jelly', r: 26, hp: 7 + wave, sp: 52 };
  else if (wave >= 2 && roll < .35) f = { type: 'spitter', r: 16, hp: 3, sp: 80, cd: K.rnd(1.5, 2.5) };
  else f = { type: 'gummy', r: 14, hp: 2, sp: K.rnd(85, 115) + wave * 3 };
  foes.push({ ...f, x, y, col: K.pick(GUMMY_COLS), t: Math.random() * 6, flash: 0 });
}
const alivePlayers = () => players.filter(p => !p.down);
function nearest(list, x, y, max) { let b = null, bd = max || 1e9; for (const o of list) { const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; b = o; } } return b; }
function collideRocks(o) { for (const r of ROCKS) { const dx = o.x - r.x, dy = o.y - r.y, d = Math.hypot(dx, dy), m = r.r + o.r; if (d < m && d > 0) { o.x = r.x + dx / d * m; o.y = r.y + dy / d * m; } } o.x = K.clamp(o.x, o.r + 8, W - o.r - 8); o.y = K.clamp(o.y, o.r + 8, H - o.r - 8); }

function hurt(p) {
  if (p.inv > 0 || p.down) return;
  if (p.shield > 0) { p.shield = 0; p.inv = .8; K.sfx(300, .2, 'triangle', .05, 300); return; }
  p.hp--; p.inv = 1; K.shake(.35); K.sfx(160, .2, 'sawtooth', .05, -60); K.burst(p.x, p.y, 10, [p.color, C.tomato], 160, .4, 3);
  if (p.hp <= 0) { p.down = true; p.revive = 0; if (!alivePlayers().length) gameOver(); }
}
function killFoe(f) {
  f.dead = true; score += { gummy: 100, spitter: 200, jelly: 400 }[f.type];
  K.burst(f.x, f.y, f.type === 'jelly' ? 26 : 12, [f.col, C.cream], f.type === 'jelly' ? 240 : 160, .5, 3.5);
  K.sfx(f.type === 'jelly' ? 120 : 260, .12, 'square', .04, -80);
  if (f.type === 'jelly') for (let k = 0; k < 2; k++) foes.push({ type: 'gummy', r: 12, hp: 1, sp: 125, x: f.x + (k ? 14 : -14), y: f.y, col: f.col, t: 0, flash: 0 });
  if (Math.random() < .1) drops.push({ x: f.x, y: f.y, kind: K.pick(['chili', 'donut', 'cherry', 'candy']), t: 0 });
}
function gameOver() {
  state = 'over'; endAt = K.t; K.playing = false;
  if (mode === 1) { K.saveBest('attack', score); K.submit(score); } else K.saveBest('attack2', score);
}

function update(dt) {
  bannerT -= dt;
  if (state !== 'play') return;
  // waves
  if (toSpawn <= 0 && !foes.length) { waveBreak -= dt; if (waveBreak <= 0) { if (wave) score += wave * 250; startWave(); waveBreak = 2.5; } }
  if (toSpawn > 0) { spawnT -= dt; if (spawnT <= 0) { spawn(); toSpawn--; spawnT = Math.max(.25, 1 - wave * .06); } }
  // players
  const ctl = mode === 1 ? [{ l: ['KeyA', 'ArrowLeft'], r: ['KeyD', 'ArrowRight'], u: ['KeyW', 'ArrowUp'], d: ['KeyS', 'ArrowDown'] }] : [{ l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'] }, { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'] }];
  for (const p of players) {
    p.inv -= dt; p.cd -= dt; p.rapid -= dt; p.shield -= dt;
    if (p.down) {
      const buddy = alivePlayers().find(o => Math.hypot(o.x - p.x, o.y - p.y) < 46);
      p.revive = buddy ? p.revive + dt : Math.max(0, p.revive - dt);
      if (p.revive >= 2) { p.down = false; p.hp = 2; p.inv = 2; K.jingle([523, 784], 80, 'triangle', .05); }
      continue;
    }
    let ix = 0, iy = 0;
    if (K.touch) { const s = K.stick(mode === 1 ? { x: 0, y: 0, w: W, h: H } : p.i ? K.RIGHT : K.LEFT, 50); if (s) { ix = s.dx; iy = s.dy; } }
    else { const c = ctl[p.i]; ix = (K.key(...c.r) ? 1 : 0) - (K.key(...c.l) ? 1 : 0); iy = (K.key(...c.d) ? 1 : 0) - (K.key(...c.u) ? 1 : 0); const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; } }
    p.x += ix * 230 * dt; p.y += iy * 230 * dt; p.r = 15; collideRocks(p);
    if (ix || iy) p.walk += dt * 12;
    const target = nearest(foes.filter(f => !f.dead), p.x, p.y, 340);
    if (target) { const a = Math.atan2(target.y - p.y, target.x - p.x); p.fx = Math.cos(a); p.fy = Math.sin(a); if (p.cd <= 0) { shots.push({ x: p.x + p.fx * 18, y: p.y + p.fy * 18, vx: p.fx * 540, vy: p.fy * 540, t: 0, col: p.color }); p.cd = p.rapid > 0 ? .09 : .2; K.sfx(800 + p.i * 100, .03, 'square', .015); } }
    else if (ix || iy) { const m = Math.hypot(ix, iy); p.fx = ix / m; p.fy = iy / m; }
  }
  // foes
  for (const f of foes) {
    f.t += dt; f.flash -= dt;
    const tgt = nearest(alivePlayers(), f.x, f.y);
    if (!tgt) continue;
    const dx = tgt.x - f.x, dy = tgt.y - f.y, d = Math.hypot(dx, dy) || 1;
    let mv = 1;
    if (f.type === 'spitter') { mv = d > 240 ? 1 : d < 170 ? -1 : 0; f.cd -= dt; if (f.cd <= 0 && d < 360) { seeds.push({ x: f.x, y: f.y, vx: dx / d * 220, vy: dy / d * 220 }); f.cd = K.rnd(1.6, 2.4); K.sfx(500, .05, 'triangle', .02, -200); } }
    f.x += dx / d * f.sp * mv * dt + Math.sin(f.t * 5) * 12 * dt; f.y += dy / d * f.sp * mv * dt;
    collideRocks(f);
    if (d < f.r + 14) hurt(tgt);
  }
  // keep foes from stacking on one spot
  for (let i = 0; i < foes.length; i++) for (let j = i + 1; j < foes.length; j++) { const a = foes[i], b = foes[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r; if (d < m && d > 0) { const p = (m - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; } }
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.t += dt;
    if (s.t > .8 || ROCKS.some(r => Math.hypot(s.x - r.x, s.y - r.y) < r.r)) s.dead = true;
    for (const f of foes) if (!f.dead && !s.dead && Math.hypot(s.x - f.x, s.y - f.y) < f.r + 4) { s.dead = true; f.hp--; f.flash = .08; if (f.hp <= 0) killFoe(f); }
  }
  for (const s of seeds) { s.x += s.vx * dt; s.y += s.vy * dt; if (s.x < 0 || s.x > W || s.y < 0 || s.y > H || ROCKS.some(r => Math.hypot(s.x - r.x, s.y - r.y) < r.r)) s.dead = true; for (const p of alivePlayers()) if (!s.dead && Math.hypot(p.x - s.x, p.y - s.y) < 18) { s.dead = true; hurt(p); } }
  for (const d of drops) {
    d.t += dt; if (d.t > 10) d.dead = true;
    for (const p of alivePlayers()) if (!d.dead && Math.hypot(p.x - d.x, p.y - d.y) < 26) {
      d.dead = true; K.jingle([660, 880, 1100], 50, 'triangle', .045);
      if (d.kind === 'chili') p.rapid = 8;
      if (d.kind === 'donut') p.shield = 15;
      if (d.kind === 'cherry') p.hp = Math.min(5, p.hp + 1);
      if (d.kind === 'candy') { K.shake(.5); K.noise(.5, .1, 600); K.burst(p.x, p.y, 40, [C.gum, C.lemon, C.cream], 380, .6, 4); for (const f of foes) if (!f.dead && Math.hypot(f.x - p.x, f.y - p.y) < 170) killFoe(f); }
    }
  }
  foes = foes.filter(f => !f.dead); shots = shots.filter(s => !s.dead); seeds = seeds.filter(s => !s.dead); drops = drops.filter(d => !d.dead);
}

function floor() {
  ctx.fillStyle = '#2b2440'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#322a4b'; for (let y = 0; y < H; y += 50) for (let x = (y / 50 % 2) * 50; x < W; x += 100) ctx.fillRect(x, y, 50, 50);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8);
  for (const r of ROCKS) { K.circle(r.x + 3, r.y + 5, r.r, 'rgba(0,0,0,.3)'); K.circle(r.x, r.y, r.r, '#e9a95c', C.ink, 3); K.circle(r.x, r.y, r.r * .7, null, 'rgba(91,52,32,.35)', 3); K.circle(r.x - r.r * .3, r.y - r.r * .3, r.r * .2, 'rgba(255,255,255,.3)'); }
}
function drawPlayer(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.down) { ctx.globalAlpha = .6; K.circle(0, 0, 16, p.color, C.ink, 2.5); ctx.globalAlpha = 1; ctx.strokeStyle = C.mint; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 24, -Math.PI / 2, -Math.PI / 2 + p.revive / 2 * Math.PI * 2); ctx.stroke(); K.text('Help!', 0, -30, 12, C.cream, 'center', 800); ctx.restore(); return; }
  if (p.inv > 0 && Math.floor(K.t * 14) % 2) ctx.globalAlpha = .45;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(2, 15, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  const bob = Math.sin(p.walk) * 2;
  K.circle(0, bob, 15, p.color, C.ink, 2.5);
  // chef hat
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; K.rr(-9, -22 + bob, 18, 9, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-5, -24 + bob, 6, 0, Math.PI * 2); ctx.arc(5, -24 + bob, 6, 0, Math.PI * 2); ctx.arc(0, -28 + bob, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); K.rr(-9, -22 + bob, 18, 9, 3); ctx.fill();
  K.circle(p.fx * 5 - 4, bob + p.fy * 3, 2.4, C.ink); K.circle(p.fx * 5 + 4, bob + p.fy * 3, 2.4, C.ink);
  // spoon blaster
  ctx.strokeStyle = '#cfd3e0'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.fx * 10, bob + p.fy * 10); ctx.lineTo(p.fx * 24, bob + p.fy * 24); ctx.stroke();
  if (p.shield > 0) K.circle(0, bob, 23, null, 'rgba(255,126,182,.85)', 3);
  if (p.rapid > 0) K.circle(0, bob, 19 + Math.sin(K.t * 20), null, 'rgba(255,90,54,.6)', 2);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawFoe(f) {
  ctx.save(); ctx.translate(f.x, f.y);
  const s = f.r / 14, wob = Math.sin(f.t * 8) * .06;
  ctx.scale(s * (1 + wob), s * (1 - wob));
  const col = f.flash > 0 ? '#fff' : f.col;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(1, 13, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  K.circle(-8, -10, 5, col, C.ink, 2); K.circle(8, -10, 5, col, C.ink, 2);
  ctx.beginPath(); ctx.ellipse(0, 2, 12, 13, 0, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  K.circle(-4, -2, 1.9, C.ink); K.circle(4, -2, 1.9, C.ink);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, 3, 3, .2, Math.PI - .2); ctx.stroke();
  K.circle(-5, -6, 2, 'rgba(255,255,255,.6)');
  if (f.type === 'spitter') { K.circle(0, 6, 3.5, C.ink); }
  ctx.restore();
}
function hud() {
  K.text(score.toLocaleString(), W / 2, 24, 22, C.cream);
  K.text(`Wave ${wave}`, W / 2, 46, 13, C.lemon, 'center', 700, false);
  players.forEach((p, k) => { for (let i = 0; i < 5; i++) { const x = k ? W - 24 - i * 22 : 24 + i * 22; ctx.save(); ctx.translate(x, 24); ctx.scale(.55, .55); ctx.beginPath(); ctx.moveTo(0, 10); ctx.bezierCurveTo(-22, -6, -10, -22, 0, -10); ctx.bezierCurveTo(10, -22, 22, -6, 0, 10); ctx.fillStyle = i < p.hp ? p.color : 'rgba(255,255,255,.15)'; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); } });
}

function draw() {
  floor();
  if (state === 'menu') {
    for (let i = 0; i < 6; i++) drawFoe({ x: 120 + i * 112, y: 390 + Math.sin(K.t * 2 + i) * 8, r: i === 2 ? 22 : 14, t: K.t + i, col: GUMMY_COLS[i % 5], flash: 0, type: 'gummy' });
    drawPlayer({ x: W / 2, y: 320, color: C.lemon, fx: Math.cos(K.t), fy: Math.sin(K.t) * .5, walk: K.t * 8, inv: 0, shield: 0, rapid: 0, down: false });
    ctx.fillStyle = 'rgba(43,36,64,.55)'; ctx.fillRect(0, 0, W, 280);
    K.text('Snack Attack', W / 2, 88, 70, C.cream);
    K.text('The gummies have gone rogue. Hold the kitchen.', W / 2, 140, 18, C.lemon, 'center', 700);
    if (K.button(W / 2 - 220, 172, 200, 60, '1 Player', { key: '1' }) || K.hit('Digit1')) newGame(1);
    if (K.button(W / 2 + 20, 172, 200, 60, '2 Players co-op', { key: '2', bg: C.sky, size: 18 }) || K.hit('Digit2')) newGame(2);
    K.text(K.touch ? 'Drag to move, your spoon aims and fires on its own. Co-op: one half of the screen each.' : 'P1: W A S D · P2: arrow keys · aiming and firing are automatic', W / 2, 262, 14, C.cream, 'center', 700, false);
    return;
  }
  for (const d of drops) { if (d.t > 7 && Math.floor(K.t * 8) % 2) continue; K.circle(d.x, d.y, 17, 'rgba(255,244,224,.12)'); K.snack(d.kind, d.x, d.y + Math.sin(d.t * 4) * 2, 11); }
  [...foes].sort((a, b) => a.y - b.y).forEach(drawFoe);
  for (const s of seeds) K.circle(s.x, s.y, 5, '#5b3420', C.ink, 1.5);
  for (const s of shots) K.circle(s.x, s.y, 4, s.col, C.ink, 1.5);
  players.forEach(drawPlayer);
  K.drawParts();
  hud();
  if (bannerT > 0 && state === 'play') { ctx.globalAlpha = Math.min(1, bannerT * 2); K.banner(banner, W / 2, H / 2, 34, C.cream); ctx.globalAlpha = 1; }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(43,36,64,.82)'; ctx.fillRect(0, 0, W, H);
    K.text('Overrun!', W / 2, 140, 60, C.tomato);
    K.text(`${score.toLocaleString()} points · wave ${wave}`, W / 2, 196, 22, C.cream, 'center', 700);
    const best = K.best(mode === 1 ? 'attack' : 'attack2'); K.text(score >= best && score > 0 ? 'New best!' : `Best ${best.toLocaleString()}`, W / 2, 228, 16, C.lemon, 'center', 700);
    if (mode === 2) K.text('Co-op runs don’t go on the leaderboard', W / 2, 254, 13, 'rgba(255,244,224,.6)', 'center', 600, false);
    if (K.t - endAt > .6) {
      if (K.button(W / 2 - 210, 286, 190, 56, 'Again', { key: 'Enter' }) || K.hit('Enter', 'Space')) newGame(mode);
      if (K.button(W / 2 + 20, 286, 190, 56, 'Menu', { bg: C.mint }) || K.hit('Escape')) state = 'menu';
    }
  }
}
K.onQuit = () => { state = 'menu'; };
K.run(update, draw);
})();
</script>
</body>
</html>
