<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snack Shack</title>
<link rel="stylesheet" href="/kit/kit.css">
<style>:root{--bg:#bfe8ff}</style>
</head>
<body>
<script src="/kit/kit.js"></script>
<script>
(() => {
const K = Kit({ W: 800, H: 450 }), { ctx, C } = K, W = 800, H = 450;
const DAY_LEN = 75, COUNTER_Y = 206, PASS_Y = 238, ST_Y = 292;
const ITEMS = {
  burger: { name: 'Burger', price: 6, cook: 3.5, station: 0 },
  taco: { name: 'Taco', price: 5, cook: 2.6, station: 1 },
  pizza: { name: 'Pizza', price: 8, cook: 5, station: 2 },
  donut: { name: 'Donut', price: 3, cook: 0, station: 3 },
  icecream: { name: 'Ice cream', price: 4, cook: 0, station: 4 },
};
const STATIONS = [
  { item: 'burger', name: 'Grill', slots: 2, unlock: 1, col: '#4a4658' },
  { item: 'taco', name: 'Griddle', slots: 2, unlock: 2, col: '#6b4a2b' },
  { item: 'pizza', name: 'Oven', slots: 1, unlock: 4, col: '#a8402e' },
  { item: 'donut', name: 'Donut case', slots: 0, unlock: 1, col: '#ff9ccf' },
  { item: 'icecream', name: 'Ice cream', slots: 0, unlock: 3, col: '#bfe8ff' },
];
const UPGRADES = [
  { id: 'grill', name: 'Bigger grill', desc: '+1 burger and taco slot', cost: 40 },
  { id: 'oven', name: 'Second oven rack', desc: '+1 pizza slot', cost: 55 },
  { id: 'hands', name: 'Quick hands', desc: 'Everything cooks 25% faster', cost: 70 },
  { id: 'bench', name: 'Comfy bench', desc: 'Customers wait 30% longer', cost: 45 },
  { id: 'tips', name: 'Tip jar', desc: 'Tips are 60% bigger', cost: 35 },
  { id: 'pass', name: 'Longer counter', desc: 'Room for 7 ready snacks', cost: 30 },
];
const SPOTS = [110, 270, 430, 590];
const BLOB = ['#ffc93c', '#2ee6c1', '#ff5da2', '#4fc3f7', '#8e6cf0', '#a6e22e', '#ff5a36'];
let state = 'menu', day, cash, earned, today, clock, customers, pass, slots, owned, spawnT, served, lost, endAt = 0, summary = null, msg = '', msgT = 0;

const stX = i => 18 + i * 155, ST_W = 145, ST_H = 140;
const unlocked = it => STATIONS[ITEMS[it].station].unlock <= day;
const passMax = () => owned.has('pass') ? 7 : 5;
const cookTime = it => ITEMS[it].cook * (owned.has('hands') ? .75 : 1);
function slotCount(i) { return STATIONS[i].slots + (i < 2 && owned.has('grill') ? 1 : 0) + (i === 2 && owned.has('oven') ? 1 : 0); }

function newGame() { day = 1; cash = 20; earned = 0; owned = new Set(); startDay(); }
function startDay() {
  clock = DAY_LEN; customers = []; pass = []; today = 0; served = 0; lost = 0; spawnT = 1;
  slots = STATIONS.map((_, i) => Array.from({ length: slotCount(i) }, () => ({ item: null, t: 0 })));
  state = 'play'; K.playing = true; say(day === 1 ? 'Burgers on the grill, donuts from the case. Go!' : newThing() || `Day ${day}. Busier than yesterday.`);
}
function newThing() { const s = STATIONS.find(s => s.unlock === day); return s ? `New on the menu: ${ITEMS[s.item].name.toLowerCase()}s!` : ''; }
function say(t) { msg = t; msgT = 3.2; }

function spawn() {
  const free = SPOTS.findIndex((_, k) => !customers.some(c => c.spot === k));
  if (free < 0) return;
  const menu = Object.keys(ITEMS).filter(unlocked);
  const n = Math.min(3, 1 + Math.floor(Math.random() * Math.min(3, 1 + day * .5)));
  const order = Array.from({ length: n }, () => K.pick(menu));
  const patience = (24 - Math.min(8, day) + order.length * 4) * (owned.has('bench') ? 1.3 : 1);
  customers.push({ spot: free, x: W + 60, order, patience, max: patience, col: K.pick(BLOB), bob: Math.random() * 6, leaving: 0, happy: false });
}
// Serve anyone whose whole order is sitting on the pass (longest-waiting first).
function autoServe() {
  const waiting = customers.filter(c => !c.leaving).sort((a, b) => a.patience / a.max - b.patience / b.max);
  for (const c of waiting) {
    const bag = [...pass], ok = c.order.every(it => { const k = bag.indexOf(it); if (k < 0) return false; bag.splice(k, 1); return true; });
    if (!ok) continue;
    for (const it of c.order) pass.splice(pass.indexOf(it), 1);
    const base = c.order.reduce((s, it) => s + ITEMS[it].price, 0);
    const tip = Math.round(base * .5 * (c.patience / c.max) * (owned.has('tips') ? 1.6 : 1));
    cash += base + tip; earned += base + tip; today += base + tip; served++;
    c.leaving = 1; c.happy = true; c.paid = `+$${base + tip}`;
    K.jingle([660, 880, 1100], 60, 'triangle', .045); K.burst(SPOTS[c.spot], 110, 12, [C.lemon, C.mint], 140, .5, 3);
  }
}
function tapStation(i) {
  if (STATIONS[i].unlock > day) return;
  const st = STATIONS[i], it = st.item;
  if (!st.slots) { // instant: straight onto the pass
    if (pass.length >= passMax()) return say('The counter’s full. Bin something by tapping it.');
    pass.push(it); K.sfx(700, .06, 'square', .035); autoServe(); return;
  }
  const s = slots[i];
  const done = s.find(x => x.item && x.t >= cookTime(x.item) && x.t < cookTime(x.item) + 6);
  if (done) { if (pass.length >= passMax()) return say('The counter’s full. Bin something by tapping it.'); pass.push(done.item); done.item = null; K.sfx(760, .06, 'square', .035); autoServe(); return; }
  const burnt = s.find(x => x.item && x.t >= cookTime(x.item) + 6);
  if (burnt) { burnt.item = null; K.noise(.15, .05, 900); return; }
  const free = s.find(x => !x.item);
  if (free) { free.item = it; free.t = 0; K.noise(.2, .03, 3000); }
}

function update(dt) {
  msgT -= dt;
  if (state !== 'play') return;
  clock -= dt;
  // customers
  spawnT -= dt;
  if (spawnT <= 0 && clock > 6) { spawn(); spawnT = Math.max(2.6, 7 - day * .55) * K.rnd(.7, 1.2); }
  for (const c of customers) {
    const tx = c.leaving ? (c.happy ? -80 : W + 80) : SPOTS[c.spot];
    c.x += (tx - c.x) * Math.min(1, dt * (c.leaving ? 2.5 : 4)); c.bob += dt * 6;
    if (!c.leaving) { c.patience -= dt; if (c.patience <= 0) { c.leaving = 1; lost++; K.sfx(200, .3, 'sawtooth', .04, -100); } }
  }
  customers = customers.filter(c => !(c.leaving && (c.x < -60 || c.x > W + 60)));
  for (const s of slots) for (const x of s) if (x.item) { const was = x.t < cookTime(x.item); x.t += dt; if (was && x.t >= cookTime(x.item)) K.sfx(1200, .08, 'triangle', .04); }
  // input: keys 1–5, tap a station, tap a snack on the counter to bin it
  for (let i = 0; i < 5; i++) if (K.hit('Digit' + (i + 1))) tapStation(i);
  for (const t of K.taps()) {
    for (let i = 0; i < 5; i++) if (t.x > stX(i) && t.x < stX(i) + ST_W && t.y > ST_Y && t.y < ST_Y + ST_H) tapStation(i);
    const k = pass.findIndex((_, k) => Math.abs(t.x - passX(k)) < 22 && Math.abs(t.y - PASS_Y - 22) < 22);
    if (k >= 0) { pass.splice(k, 1); K.noise(.12, .04, 1200); }
  }
  if (clock <= 0) closeUp();
}
const passX = k => 96 + k * 50;
function closeUp() {
  const rent = 25 + (day - 1) * 18;
  cash -= rent;
  summary = { day, today, rent, served, lost, broke: cash < 0 };
  state = 'summary'; K.playing = false; endAt = K.t;
  if (summary.broke) { K.saveBest('shack', earned); K.submit(earned); K.sfx(160, .6, 'sawtooth', .05, -80); }
  else K.jingle([523, 659, 784], 100, 'square', .04);
}

// ---------- drawing ----------
function scene() {
  ctx.fillStyle = '#bfe8ff'; ctx.fillRect(0, 0, W, 200);
  ctx.fillStyle = '#d7f2ff'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(120 + i * 210, 40 + (i % 2) * 18, 46, 14, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#9ad4a0'; ctx.fillRect(0, 160, W, 46);
  // awning
  for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? '#fff4e0' : '#ff5a36'; ctx.beginPath(); ctx.moveTo(i * 50, 0); ctx.lineTo(i * 50 + 50, 0); ctx.lineTo(i * 50 + 50, 18); ctx.quadraticCurveTo(i * 50 + 25, 32, i * 50, 18); ctx.fill(); }
  // counter
  ctx.fillStyle = '#c97b3f'; ctx.fillRect(0, COUNTER_Y, W, 82); ctx.fillStyle = '#e9a95c'; ctx.fillRect(0, COUNTER_Y, W, 12);
  ctx.fillStyle = '#15131f'; ctx.fillRect(0, COUNTER_Y + 12, W, 3);
  ctx.fillStyle = '#2a2140'; ctx.fillRect(0, ST_Y - 8, W, H - ST_Y + 8);
}
function drawCustomer(c) {
  const y = 150 + Math.sin(c.bob) * 2;
  const mood = c.leaving ? (c.happy ? 1 : 0) : c.patience / c.max;
  ctx.save(); ctx.translate(c.x, y);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 52, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-26, 52); ctx.quadraticCurveTo(-30, -8, 0, -10); ctx.quadraticCurveTo(30, -8, 26, 52); ctx.closePath(); ctx.fillStyle = c.col; ctx.fill(); ctx.strokeStyle = '#15131f'; ctx.lineWidth = 3; ctx.stroke();
  K.circle(-8, 12, 4.5, '#fff', '#15131f', 2); K.circle(8, 12, 4.5, '#fff', '#15131f', 2); K.circle(-7, 13, 2, '#15131f'); K.circle(9, 13, 2, '#15131f');
  ctx.beginPath(); if (mood > .5) ctx.arc(0, 24, 6, .2, Math.PI - .2); else if (mood > .25) { ctx.moveTo(-5, 27); ctx.lineTo(5, 27); } else ctx.arc(0, 31, 6, Math.PI + .3, -.3); ctx.stroke();
  if (mood <= .25 && !c.leaving) { ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(-4, 6); ctx.moveTo(14, 2); ctx.lineTo(4, 6); ctx.stroke(); }
  ctx.restore();
  if (c.leaving) { if (c.paid) K.text(c.paid, c.x, 100 - c.leaving * 10, 18, '#2a8f3e', 'center', 800, '#fff'); return; }
  // order bubble
  const w = c.order.length * 36 + 14, bx = c.x - w / 2, by = 60;
  ctx.fillStyle = '#fff'; K.rr(bx, by, w, 46, 12); ctx.fill(); ctx.strokeStyle = '#15131f'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c.x - 6, by + 46); ctx.lineTo(c.x, by + 56); ctx.lineTo(c.x + 6, by + 46); ctx.fillStyle = '#fff'; ctx.fill();
  c.order.forEach((it, k) => K.snack(it, bx + 25 + k * 36, by + 22, 12));
  ctx.fillStyle = '#e8e2f0'; ctx.fillRect(bx + 8, by + 40, w - 16, 4);
  ctx.fillStyle = mood > .5 ? '#2ee6c1' : mood > .25 ? '#ffc93c' : '#ff5a36'; ctx.fillRect(bx + 8, by + 40, (w - 16) * mood, 4);
}
function drawStation(i) {
  const st = STATIONS[i], x = stX(i), y = ST_Y, locked = st.unlock > day;
  ctx.fillStyle = '#15131f'; K.rr(x + 3, y + 4, ST_W, ST_H, 14); ctx.fill();
  ctx.fillStyle = locked ? '#3a3350' : st.col; K.rr(x, y, ST_W, ST_H, 14); ctx.fill(); ctx.strokeStyle = '#15131f'; ctx.lineWidth = 3; ctx.stroke();
  K.text(st.name, x + 12, y + 18, 14, locked ? '#8d8aa6' : i >= 3 ? '#15131f' : '#fff4e0', 'left', 800, false);
  if (!K.touch && !locked) K.text(String(i + 1), x + ST_W - 14, y + 18, 12, i >= 3 ? 'rgba(21,19,31,.5)' : 'rgba(255,244,224,.6)', 'center', 800, false);
  if (locked) { K.text(`Day ${st.unlock}`, x + ST_W / 2, y + 80, 15, '#8d8aa6', 'center', 800, false); return; }
  if (!st.slots) {
    K.snack(st.item, x + ST_W / 2, y + 78, 26);
    K.text(`$${ITEMS[st.item].price} · tap to add`, x + ST_W / 2, y + 122, 12, '#15131f', 'center', 700, false);
    return;
  }
  const n = slots[i].length;
  slots[i].forEach((s, k) => {
    const sx = x + ST_W / (n + 1) * (k + 1), sy = y + 76;
    K.circle(sx, sy, 26, 'rgba(0,0,0,.35)', '#15131f', 2.5);
    if (!s.item) return;
    const ct = cookTime(s.item), p = Math.min(1, s.t / ct), burnt = s.t >= ct + 6, ready = s.t >= ct && !burnt;
    if (burnt) { K.circle(sx, sy, 16, '#2a2a2a', '#000', 2); K.text('burnt', sx, sy + 38, 11, '#ff8a8a', 'center', 800, false); return; }
    ctx.globalAlpha = .5 + p * .5; K.snack(s.item, sx, sy, 15); ctx.globalAlpha = 1;
    ctx.strokeStyle = ready ? '#2ee6c1' : '#ffc93c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(sx, sy, 22, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    if (ready) { const warn = (s.t - ct) / 6; K.text(warn > .6 ? 'hurry!' : 'ready', sx, sy + 38, 11, warn > .6 ? '#ffb3b3' : '#c4fff2', 'center', 800, false); }
    if (!ready && Math.random() < .2) K.burst(sx, sy - 10, 1, ['rgba(255,255,255,.5)'], 20, .6, 3, -40);
  });
  K.text(`$${ITEMS[st.item].price}`, x + ST_W / 2, y + 126, 12, 'rgba(255,244,224,.75)', 'center', 700, false);
}

function draw() {
  scene();
  if (state === 'menu') {
    K.snack('burger', 150, 280, 40, -.2); K.snack('donut', 650, 280, 40, .2); K.snack('taco', 260, 380, 30); K.snack('icecream', 540, 380, 30);
    ctx.fillStyle = 'rgba(42,33,64,.35)'; ctx.fillRect(0, 0, W, H);
    K.text('Snack Shack', W / 2, 96, 72, '#fff4e0', 'center', 800, '#15131f');
    K.text('Cook it, serve it, pay the rent. How many days can you keep it open?', W / 2, 150, 18, '#15131f', 'center', 800, false);
    if (K.button(W / 2 - 110, 190, 220, 60, 'Open the shack', { key: 'Enter' }) || K.hit('Enter', 'Space')) newGame();
    K.text(K.touch ? 'Tap a station to cook, tap again when it’s ready. Orders go out by themselves.' : 'Click a station (or press 1 to 5) to cook, again when it’s ready. Orders go out by themselves.', W / 2, 296, 14, '#fff4e0', 'center', 700);
    const b = K.best('shack'); if (b) K.text(`Best: $${b.toLocaleString()} earned`, W / 2, 330, 14, C.lemon, 'center', 800);
    return;
  }
  customers.forEach(drawCustomer);
  // the counter with ready snacks
  for (let k = 0; k < passMax(); k++) { ctx.fillStyle = 'rgba(21,19,31,.18)'; K.rr(passX(k) - 22, PASS_Y, 44, 44, 10); ctx.fill(); }
  pass.forEach((it, k) => K.snack(it, passX(k), PASS_Y + 22, 15));
  K.text('Ready', 14, PASS_Y + 22, 12, '#5b3420', 'left', 800, false);
  for (let i = 0; i < 5; i++) drawStation(i);
  K.drawParts();
  // HUD
  ctx.fillStyle = 'rgba(21,19,31,.85)'; K.rr(W - 236, 4, 228, 30, 10); ctx.fill();
  K.text(`Day ${day}`, W - 224, 19, 15, '#fff4e0', 'left', 800, false);
  ctx.fillStyle = '#4a4658'; K.rr(W - 160, 13, 70, 12, 6); ctx.fill();
  ctx.fillStyle = clock < 10 ? C.tomato : C.mint; K.rr(W - 160, 13, 70 * Math.max(0, clock) / DAY_LEN, 12, 6); ctx.fill();
  K.text(`$${cash}`, W - 18, 19, 16, C.lemon, 'right', 800, false);
  if (msgT > 0 && state === 'play') { ctx.globalAlpha = Math.min(1, msgT); K.banner(msg, 612, PASS_Y + 22, 13, '#fff4e0'); ctx.globalAlpha = 1; }
  if (state === 'summary') {
    ctx.fillStyle = 'rgba(21,19,31,.84)'; ctx.fillRect(0, 0, W, H);
    const s = summary;
    if (s.broke) {
      K.text('The shack closed down.', W / 2, 100, 44, C.tomato);
      K.text(`You couldn’t cover the $${s.rent} rent on day ${s.day}.`, W / 2, 148, 18, '#fff4e0', 'center', 700);
      K.text(`Total earned: $${earned.toLocaleString()}`, W / 2, 182, 22, C.lemon);
      if (K.t - endAt > .7) {
        if (K.button(W / 2 - 210, 230, 190, 56, 'Start over', { key: 'Enter' }) || K.hit('Enter', 'Space')) newGame();
        if (K.button(W / 2 + 20, 230, 190, 56, 'Menu', { bg: C.mint }) || K.hit('Escape')) state = 'menu';
      }
      return;
    }
    K.text(`Day ${s.day} done`, W / 2, 50, 36, '#fff4e0');
    K.text(`Took $${s.today}  ·  rent $${s.rent}  ·  ${s.served} served, ${s.lost} walked out  ·  cash $${cash}`, W / 2, 88, 15, '#cfcde6', 'center', 700, false);
    K.text('Spend on upgrades, or save it. Rent goes up every day.', W / 2, 116, 14, C.lemon, 'center', 700, false);
    UPGRADES.forEach((u, k) => {
      const x = 40 + (k % 3) * 245, y = 140 + Math.floor(k / 3) * 104, have = owned.has(u.id), afford = cash >= u.cost;
      ctx.fillStyle = have ? 'rgba(46,230,193,.18)' : 'rgba(255,255,255,.07)'; K.rr(x, y, 230, 92, 14); ctx.fill();
      ctx.strokeStyle = have ? C.mint : 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; ctx.stroke();
      K.text(u.name, x + 14, y + 20, 15, '#fff4e0', 'left', 800, false); K.text(u.desc, x + 14, y + 42, 12, '#cfcde6', 'left', 600, false);
      if (have) K.text('Bought', x + 14, y + 70, 13, C.mint, 'left', 800, false);
      else if (K.button(x + 14, y + 54, 120, 30, `Buy $${u.cost}`, { size: 13, bg: afford ? C.lemon : '#8d8aa6' }) && afford) { cash -= u.cost; owned.add(u.id); K.jingle([660, 990], 70, 'triangle', .05); }
    });
    if (K.t - endAt > .6 && (K.button(W / 2 - 120, 362, 240, 56, `Open day ${day + 1}`, { key: 'Enter', bg: C.mint }) || K.hit('Enter'))) { day++; startDay(); }
  }
}
K.onQuit = () => { state = 'menu'; };
K.run(update, draw);
})();
</script>
</body>
</html>
